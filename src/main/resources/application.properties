spring.application.name=task-management-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_manager}
spring.datasource.username=${DB_USERNAME:task_user}
spring.datasource.password=${DB_PASSWORD:task_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:development-secret-key-change-me-1234567890}
app.jwt.expiration-seconds=3600

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs